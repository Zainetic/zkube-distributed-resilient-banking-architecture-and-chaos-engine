apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: transactions-pod-kill
  namespace: default
spec:
  schedule: "@every 30s"
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
        - default
      labelSelectors:
        app: transactions
