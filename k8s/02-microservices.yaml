# ---------------------------------------------------------
# ACCOUNTS SERVICE
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
      - name: accounts
        image: zkube-accounts:latest
        imagePullPolicy: Never 
        ports:
        - containerPort: 8081
        livenessProbe:
          httpGet:
            path: /api/accounts/health
            port: 8081
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /api/accounts/health
            port: 8081
          initialDelaySeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-service
spec:
  type: LoadBalancer 
  selector:
    app: accounts
  ports:
    - port: 8081
      targetPort: 8081

---
