# ---------------------------------------------------------
# ACCOUNTS SERVICE
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
      - name: accounts
        image: zkube-accounts:latest
        imagePullPolicy: Never 
        ports:
        - containerPort: 8081
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: zkube-secrets
              key: DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: zkube-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zkube-secrets
              key: POSTGRES_PASSWORD
        livenessProbe:
          httpGet:
            path: /api/accounts/health
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/accounts/health
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 1
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-service
spec:
  type: LoadBalancer 
  selector:
    app: accounts
  ports:
    - port: 8081
      targetPort: 8081

---
# ---------------------------------------------------------
# TRANSACTIONS SERVICE
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-deployment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      containers:
      - name: transactions
        image: zkube-transactions:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: zkube-secrets
              key: DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: zkube-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zkube-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          value: "redis-cache"
        - name: REDIS_PORT
          value: "6379"
        livenessProbe:
          httpGet:
            path: /api/transactions/health 
            port: 8082
          initialDelaySeconds: 3
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/transactions/health
            port: 8082
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 1
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-service
spec:
  type: LoadBalancer 
  selector:
    app: transactions
  ports:
    - port: 8082
      targetPort: 8082

---
